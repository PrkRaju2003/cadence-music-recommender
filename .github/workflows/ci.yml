name: Validate Cadence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m cadence.seed
      - run: python -m pytest -q
      - run: python -m cadence.evaluate
      - run: python -m cadence.export
      - run: python -m scripts.query_plans
      - name: Validate official Power BI JSON schemas
        run: python scripts/validate_powerbi.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: evaluation-and-analytics
          path: |
            docs/evaluation.json
            docs/query-plan.txt
            exports/

      - name: Build deployment container
        run: docker build --tag cadence:test .
      - name: Start deployment container
        run: docker run --detach --name cadence-smoke --publish 127.0.0.1:8000:8000 cadence:test
      - name: Smoke test the running container
        run: python scripts/smoke_http.py --base-url http://127.0.0.1:8000
      - name: Stop test container
        if: always()
        run: docker rm --force cadence-smoke || true
